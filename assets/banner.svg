<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Card/Pill Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 19px; fill: #cbd5e1; }
    .badge-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    
    /* Dynamic floating background particles animation */
    @keyframes floatParticle1 {
      0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
      50% { transform: translate(30px, -20px) scale(1.1); opacity: 0.6; }
      100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
    }

    @keyframes floatParticle2 {
      0% { transform: translate(0, 0); opacity: 0.2; }
      50% { transform: translate(-25px, 25px); opacity: 0.5; }
      100% { transform: translate(0, 0); opacity: 0.2; }
    }

    @keyframes pulseLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes shimmer {
      0% { opacity: 0.4; }
      50% { opacity: 0.9; }
      100% { opacity: 0.4; }
    }

    .particle-1 { animation: floatParticle1 8s ease-in-out infinite; }
    .particle-2 { animation: floatParticle2 10s ease-in-out infinite; }
    .animated-pulse { stroke-dasharray: 200; stroke-dashoffset: 400; animation: pulseLine 6s linear infinite; }
    .shimmer-bg { animation: shimmer 4s ease-in-out infinite; }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>

  <!-- Background Decorative Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
  </g>

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (placed behind text/content) -->
  <g id="dynamic-background-elements">
    <!-- Glowing Orbs in Background -->
    <circle cx="150" cy="80" r="140" fill="url(#primaryGlow)" opacity="0.15" class="shimmer-bg" filter="blur(40px)" />
    <circle cx="1050" cy="240" r="160" fill="url(#cyanGlow)" opacity="0.15" class="shimmer-bg" filter="blur(50px)" />

    <!-- Animated Flow Lines in background (Behind Foreground) -->
    <path d="M 50,260 Q 300,180 600,260 T 1150,180" fill="none" stroke="url(#cyanGlow)" stroke-width="2" opacity="0.3" class="animated-pulse" />
    <path d="M 50,280 Q 400,200 800,280 T 1150,200" fill="none" stroke="url(#primaryGlow)" stroke-width="2" opacity="0.25" class="animated-pulse" />

    <!-- Floating Background Nodes/Pills -->
    <g class="particle-1">
      <rect x="850" y="45" width="130" height="34" rx="17" fill="url(#cardGrad)" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1" />
      <circle cx="870" cy="62" r="5" fill="#6366f1" />
      <text x="885" y="66" class="badge-text" opacity="0.8">⚡ Playwright</text>
    </g>

    <g class="particle-2">
      <rect x="980" y="105" width="120" height="34" rx="17" fill="url(#cardGrad)" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1" />
      <circle cx="1000" cy="122" r="5" fill="#06b6d4" />
      <text x="1015" y="126" class="badge-text" opacity="0.8">🌲 Cypress</text>
    </g>

    <g class="particle-1">
      <rect x="900" y="170" width="140" height="34" rx="17" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
      <circle cx="920" cy="187" r="5" fill="#10b981" />
      <text x="935" y="191" class="badge-text" opacity="0.8">🤖 AI Self-Healing</text>
    </g>

    <g class="particle-2">
      <rect x="760" y="110" width="130" height="34" rx="17" fill="url(#cardGrad)" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1" />
      <circle cx="780" cy="127" r="5" fill="#a855f7" />
      <text x="795" y="131" class="badge-text" opacity="0.8">☁️ Cloud Exec</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed clean readability) -->
  <g id="foreground-content" transform="translate(60, 0)">
    <!-- Top Category Tag -->
    <rect x="0" y="55" width="220" height="30" rx="15" fill="url(#primaryGlow)" opacity="0.9" />
    <text x="110" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#ffffff" letter-spacing="1">CURATED ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="135" class="title">Awesome E2E Test Automation</text>

    <!-- Subtitle -->
    <text x="0" y="175" class="subtitle">Top SaaS Platforms &amp; Open-Source Projects for Modern QA &amp; SDET Teams</text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 215)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="165" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="15" y="23" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#38bdf8">🤖 AI Self-Healing</text>

      <!-- Tag 2 -->
      <rect x="177" y="0" width="175" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="192" y="23" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#a78bfa">⚡ Cloud Execution</text>

      <!-- Tag 3 -->
      <rect x="364" y="0" width="160" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="379" y="23" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#4ade80">🎯 Low-Code / No-Code</text>

      <!-- Tag 4 -->
      <rect x="536" y="0" width="160" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="551" y="23" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#fbbf24">🔄 CI/CD Pipelines</text>
    </g>
  </g>
</svg>
